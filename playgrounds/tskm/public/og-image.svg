<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">tskm playground</title>
  <desc id="description">A social preview image for the tskm playground, showing schema code, generated TypeScript output, and parse results.</desc>
  <defs>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#202428" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .code-keyword {
        fill: #1f5b59;
      }
      .code-string {
        fill: #8b4d18;
      }
      .code-type {
        fill: #2f5d84;
      }
      .code-muted {
        fill: #6d746b;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F7F8F4"/>
  <path d="M0 101H1200" stroke="#DDE1D8" stroke-width="1"/>
  <path d="M0 526H1200" stroke="#DDE1D8" stroke-width="1"/>
  <path d="M104 0V630" stroke="#E5E8DF" stroke-width="1"/>
  <path d="M1096 0V630" stroke="#E5E8DF" stroke-width="1"/>

  <g opacity="0.86">
    <rect x="70" y="70" width="1060" height="490" rx="18" fill="#FBFCF8" stroke="#D6D9D1" filter="url(#panel-shadow)"/>
    <rect x="70" y="70" width="1060" height="58" rx="18" fill="#F2F4EE" stroke="#D6D9D1"/>
    <path d="M70 128H1130" stroke="#D6D9D1"/>
    <circle cx="104" cy="99" r="7" fill="#B95C4B"/>
    <circle cx="130" cy="99" r="7" fill="#CDA83A"/>
    <circle cx="156" cy="99" r="7" fill="#2D6F6D"/>
  </g>

  <g transform="translate(120 146)">
    <text class="sans" x="0" y="112" fill="#202428" font-size="88" font-weight="760" letter-spacing="0">tskm</text>
    <text class="sans" x="0" y="188" fill="#202428" font-size="68" font-weight="650" letter-spacing="0">playground</text>
    <text class="sans" x="2" y="256" fill="#4D544B" font-size="29" font-weight="450" letter-spacing="0">Try schemas, generated types,</text>
    <text class="sans" x="2" y="294" fill="#4D544B" font-size="29" font-weight="450" letter-spacing="0">and parse results side by side.</text>

  </g>

  <g transform="translate(650 132)">
    <rect x="0" y="0" width="430" height="188" rx="14" fill="#FFFEFB" stroke="#CCD2C8"/>
    <path d="M0 42V14C0 6.268 6.268 0 14 0H416C423.732 0 430 6.268 430 14V42Z" fill="#F2F4EE"/>
    <path d="M0 42H430" stroke="#CCD2C8"/>
    <text class="sans" x="18" y="27" fill="#4D544B" font-size="15" font-weight="700" letter-spacing="0">Schema</text>
    <text class="mono code-keyword" x="24" y="76" font-size="19" font-weight="600" letter-spacing="0">const</text>
    <text class="mono" x="92" y="76" fill="#202428" font-size="19" letter-spacing="0">user = object({</text>
    <text class="mono" x="44" y="110" fill="#202428" font-size="19" letter-spacing="0">name: string(),</text>
    <text class="mono" x="44" y="144" fill="#202428" font-size="19" letter-spacing="0">email: pipe(string(), email()),</text>
    <text class="mono" x="24" y="178" fill="#202428" font-size="19" letter-spacing="0">})</text>

    <rect x="0" y="212" width="430" height="188" rx="14" fill="#FFFEFB" stroke="#CCD2C8"/>
    <path d="M0 254V226C0 218.268 6.268 212 14 212H416C423.732 212 430 218.268 430 226V254Z" fill="#F2F4EE"/>
    <path d="M0 254H430" stroke="#CCD2C8"/>
    <text class="sans" x="18" y="239" fill="#4D544B" font-size="15" font-weight="700" letter-spacing="0">Generated type</text>
    <text class="mono code-keyword" x="24" y="282" font-size="18" font-weight="600" letter-spacing="0">type</text>
    <text class="mono code-type" x="77" y="282" font-size="18" font-weight="600" letter-spacing="0">User</text>
    <text class="mono" x="127" y="282" fill="#202428" font-size="18" letter-spacing="0">= {</text>
    <text class="mono" x="44" y="312" fill="#202428" font-size="18" letter-spacing="0">name: string;</text>
    <text class="mono" x="44" y="342" fill="#202428" font-size="18" letter-spacing="0">email: string;</text>
    <text class="mono" x="24" y="372" fill="#202428" font-size="18" letter-spacing="0">}</text>
  </g>
</svg>
