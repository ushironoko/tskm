<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">tskm playground</title>
  <desc id="description">A social preview image for the tskm playground, showing schema code, generated TypeScript output, and parse results.</desc>
  <defs>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#202428" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .code-keyword {
        fill: #1f5b59;
      }
      .code-string {
        fill: #8b4d18;
      }
      .code-type {
        fill: #2f5d84;
      }
      .code-muted {
        fill: #6d746b;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F7F8F4"/>
  <path d="M0 101H1200" stroke="#DDE1D8" stroke-width="1"/>
  <path d="M0 526H1200" stroke="#DDE1D8" stroke-width="1"/>
  <path d="M104 0V630" stroke="#E5E8DF" stroke-width="1"/>
  <path d="M1096 0V630" stroke="#E5E8DF" stroke-width="1"/>

  <g opacity="0.86">
    <rect x="70" y="70" width="1060" height="490" rx="18" fill="#FBFCF8" stroke="#D6D9D1" filter="url(#panel-shadow)"/>
    <rect x="70" y="70" width="1060" height="58" rx="18" fill="#F2F4EE" stroke="#D6D9D1"/>
    <path d="M70 128H1130" stroke="#D6D9D1"/>
    <circle cx="104" cy="99" r="7" fill="#B95C4B"/>
    <circle cx="130" cy="99" r="7" fill="#CDA83A"/>
    <circle cx="156" cy="99" r="7" fill="#2D6F6D"/>
  </g>

  <g transform="translate(120 174)">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="#202428"/>
    <path d="M29 36H79" stroke="#F7F8F4" stroke-width="7" stroke-linecap="square"/>
    <path d="M54 36V78" stroke="#F7F8F4" stroke-width="7" stroke-linecap="square"/>
    <path d="M33 79H75" stroke="#2D6F6D" stroke-width="7" stroke-linecap="square"/>

    <text class="sans" x="0" y="178" fill="#202428" font-size="88" font-weight="760" letter-spacing="0">tskm</text>
    <text class="sans" x="0" y="254" fill="#202428" font-size="68" font-weight="650" letter-spacing="0">playground</text>
    <text class="sans" x="2" y="312" fill="#4D544B" font-size="29" font-weight="450" letter-spacing="0">Try schemas, generated types,</text>
    <text class="sans" x="2" y="350" fill="#4D544B" font-size="29" font-weight="450" letter-spacing="0">and parse results side by side.</text>

    <g transform="translate(0 360)">
      <rect x="0" y="0" width="166" height="42" rx="21" fill="#E7F1EF" stroke="#93B7B4"/>
      <text class="sans" x="22" y="28" fill="#184C4B" font-size="17" font-weight="650" letter-spacing="0">Standard Schema</text>
      <rect x="184" y="0" width="116" height="42" rx="21" fill="#FFF6DB" stroke="#D3B768"/>
      <text class="sans" x="206" y="28" fill="#6F5313" font-size="17" font-weight="650" letter-spacing="0">AOT types</text>
      <rect x="318" y="0" width="134" height="42" rx="21" fill="#EDF1F5" stroke="#AAB8C8"/>
      <text class="sans" x="340" y="28" fill="#2F4F68" font-size="17" font-weight="650" letter-spacing="0">Live parsing</text>
    </g>
  </g>

  <g transform="translate(650 144)">
    <rect x="0" y="0" width="430" height="236" rx="14" fill="#FFFEFB" stroke="#CCD2C8"/>
    <rect x="0" y="0" width="430" height="42" rx="14" fill="#F2F4EE" stroke="#CCD2C8"/>
    <path d="M0 42H430" stroke="#CCD2C8"/>
    <text class="sans" x="18" y="27" fill="#4D544B" font-size="15" font-weight="700" letter-spacing="0">Schema</text>
    <text class="mono code-keyword" x="24" y="76" font-size="19" font-weight="600" letter-spacing="0">const</text>
    <text class="mono" x="92" y="76" fill="#202428" font-size="19" letter-spacing="0">user = object({</text>
    <text class="mono" x="44" y="110" fill="#202428" font-size="19" letter-spacing="0">id: templateLiteral([</text>
    <text class="mono code-string" x="275" y="110" font-size="19" letter-spacing="0">&quot;usr_&quot;</text>
    <text class="mono" x="344" y="110" fill="#202428" font-size="19" letter-spacing="0">, string()]),</text>
    <text class="mono" x="44" y="144" fill="#202428" font-size="19" letter-spacing="0">email: pipe(string(), email()),</text>
    <text class="mono" x="44" y="178" fill="#202428" font-size="19" letter-spacing="0">role: picklist([</text>
    <text class="mono code-string" x="217" y="178" font-size="19" letter-spacing="0">&quot;admin&quot;</text>
    <text class="mono" x="296" y="178" fill="#202428" font-size="19" letter-spacing="0">, </text>
    <text class="mono code-string" x="321" y="178" font-size="19" letter-spacing="0">&quot;user&quot;</text>
    <text class="mono" x="385" y="178" fill="#202428" font-size="19" letter-spacing="0">]),</text>
    <text class="mono" x="24" y="212" fill="#202428" font-size="19" letter-spacing="0">})</text>

    <rect x="0" y="260" width="430" height="126" rx="14" fill="#FFFEFB" stroke="#CCD2C8"/>
    <rect x="0" y="260" width="430" height="42" rx="14" fill="#F2F4EE" stroke="#CCD2C8"/>
    <path d="M0 302H430" stroke="#CCD2C8"/>
    <text class="sans" x="18" y="287" fill="#4D544B" font-size="15" font-weight="700" letter-spacing="0">Generated type</text>
    <text class="mono code-keyword" x="24" y="327" font-size="18" font-weight="600" letter-spacing="0">type</text>
    <text class="mono code-type" x="77" y="327" font-size="18" font-weight="600" letter-spacing="0">User</text>
    <text class="mono" x="127" y="327" fill="#202428" font-size="18" letter-spacing="0">= {</text>
    <text class="mono" x="44" y="353" fill="#202428" font-size="18" letter-spacing="0">id: `usr_${string}`; email: string;</text>
    <text class="mono" x="44" y="379" fill="#202428" font-size="18" letter-spacing="0">role: </text>
    <text class="mono code-string" x="111" y="379" font-size="18" letter-spacing="0">&quot;admin&quot;</text>
    <text class="mono" x="189" y="379" fill="#202428" font-size="18" letter-spacing="0"> | </text>
    <text class="mono code-string" x="220" y="379" font-size="18" letter-spacing="0">&quot;user&quot;</text>
    <text class="mono" x="281" y="379" fill="#202428" font-size="18" letter-spacing="0"> }</text>

    <g transform="translate(0 412)">
      <rect x="0" y="0" width="430" height="58" rx="14" fill="#202428"/>
      <circle cx="30" cy="29" r="11" fill="#2D6F6D"/>
      <path d="M25 29L29 33L36 25" stroke="#FFFEFB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="mono" x="54" y="36" fill="#FFFEFB" font-size="18" font-weight="600" letter-spacing="0">{ ok: true, issues: [] }</text>
    </g>
  </g>
</svg>
