# Keeps SHA-pinned GitHub Actions current. Dependabot reads the `# vX.Y.Z` comment next
# to each pinned commit SHA and bumps both the SHA and the comment together, so pinning
# does not freeze us on stale (potentially vulnerable) action versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Stay on changesets/action v1: v2 requires Changesets CLI v3, and this repo is on CLI v2.
      # Its major bumps must move together with the CLI v3 migration, so skip them until then.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
