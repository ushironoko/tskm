# Checker compatibility. Not triggered by pull_request or push, so a failure
# cannot block a merge.
#
# The compiler talks to the official `typescript/sync` API. The client and the
# native `lib/tsc` binary ship in the same package, so a cell swaps that
# package rather than pointing a foreign binary at a different client. The
# pinned cell is the lockfile (`typescript@7.1.0-beta` today). `beta` is the
# 7.1 RC / stable line. `next` is where protocol changes show up first; the
# sync API hides them, which is why this matrix exists.
#
# 7.0.x (`typescript/unstable/sync`) is not a cell. Its snapshot and virtual
# filesystem are a different client, not an import-path alias.
#
# Schedule failure mail goes only to the person who last modified this file
# (GitHub's schedule notification rule). This workflow does not open issues or
# take any write permission.
name: Compat

on:
  schedule:
    # Daily, off the hour, so it does not land on the same minute as other jobs.
    - cron: "17 6 * * *"
  workflow_dispatch:

# A manual run can replace an in-flight daily run on the same ref.
concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compat:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pin
            title: pinned typescript
            tag: ""
          # 7.1 RC (2026-11-10) and stable (2026-11-24) follow this dist-tag.
          - id: beta
            title: typescript beta
            tag: beta
          # Nightly. Picks up API changes before they reach beta.
          - id: next
            title: typescript next
            tag: next
    env:
      COMPAT_CELL: ${{ matrix.id }}
      COMPAT_TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # bun-version is read from package.json "packageManager" (bun@1.3.13) automatically.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts blocks dependency lifecycle scripts (the preinstall/postinstall
      # vector used by Shai-Hulud-class worms). Safe here: the native deps ship prebuilt
      # binaries via os/cpu-constrained optionalDependencies with no lifecycle scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Fail if install mutated the lockfile (frozen install already forbids it; this
      # makes a tampered/desynced bun.lock an explicit, visible failure). Later steps
      # may rewrite the lockfile; that rewrite stays on the runner.
      - name: Verify lockfile is unchanged
        run: git diff --exit-code bun.lock

      # Install the dist-tag into @tskm/compiler so `typescript/sync` resolves to it.
      # The pinned cell keeps the lockfile. The rewrite stays on the runner.
      - name: Swap in typescript@${{ matrix.tag }}
        if: matrix.tag != ''
        env:
          TYPESCRIPT_DIST_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          echo "npm dist-tag ${TYPESCRIPT_DIST_TAG} typescript=$(npm view "typescript@${TYPESCRIPT_DIST_TAG}" version)"
          bun add --exact --ignore-scripts "typescript@${TYPESCRIPT_DIST_TAG}" --cwd packages/compiler

      # The typescript version require() returns for @tskm/compiler, plus the
      # native lib/tsc the client spawns. Printed before the tests so a failing
      # log and the step summary both name the resolved version.
      - name: Record resolved checker version
        id: versions
        run: |
          bun - <<'EOF'
          import { spawnSync } from "node:child_process"
          import { appendFileSync, existsSync } from "node:fs"
          import { createRequire } from "node:module"
          import { dirname, join } from "node:path"

          const require = createRequire(join(process.cwd(), "packages/compiler/package.json"))

          function oneLine(value) {
            return String(value).replace(/\r?\n/g, " ").trim()
          }

          const typescriptPath = require.resolve("typescript/package.json")
          const typescript = require(typescriptPath)
          const metaRequire = createRequire(typescriptPath)
          const platName = `@typescript/typescript-${process.platform}-${process.arch}`
          const platPath = metaRequire.resolve(`${platName}/package.json`)
          const plat = metaRequire(platPath)
          const exe = join(dirname(platPath), "lib", "tsc")

          const errors = []
          let tsgoVersion = "unavailable"
          if (!existsSync(exe)) {
            errors.push(`native tsc not found at ${exe}`)
          } else {
            const ver = spawnSync(exe, ["--version"], { encoding: "utf8", timeout: 30_000 })
            tsgoVersion = oneLine(`${ver.stdout ?? ""}${ver.stderr ?? ""}`) || "empty"
            if (ver.status !== 0) errors.push(`tsc --version exited ${ver.status}: ${tsgoVersion}`)
          }

          const cell = process.env.COMPAT_CELL ?? "unknown"
          const tag = process.env.COMPAT_TAG || "pin"
          const report = [
            `cell ${cell} tag=${tag}`,
            `typescript ${typescript.version}`,
            `${platName} ${plat.version}`,
            `lib/tsc ${exe}`,
            `tsc --version: ${tsgoVersion}`,
          ]
          for (const line of report) console.log(line)

          const output = process.env.GITHUB_OUTPUT
          if (output) {
            const fields = {
              cell,
              tag,
              typescript: typescript.version,
              platform: `${platName}@${plat.version}`,
              exe,
              tsgo: tsgoVersion,
            }
            appendFileSync(
              output,
              `${Object.entries(fields)
                .map(([key, value]) => `${key}=${oneLine(value)}`)
                .join("\n")}\n`,
            )
          }

          const summary = process.env.GITHUB_STEP_SUMMARY
          if (summary) {
            appendFileSync(
              summary,
              [
                `### ${cell}`,
                "",
                "Resolved from `@tskm/compiler`. `lib/tsc` is the binary the sync client spawns.",
                "",
                "| | resolved |",
                "| --- | --- |",
                `| tag | \`${tag}\` |`,
                `| \`typescript\` | \`${typescript.version}\` |`,
                `| \`${platName}\` | \`${plat.version}\` |`,
                `| \`lib/tsc\` | \`${exe}\` |`,
                `| \`tsc --version\` | \`${tsgoVersion}\` |`,
                "",
              ].join("\n"),
            )
          }

          if (errors.length > 0) {
            for (const error of errors) console.error(error)
            process.exit(1)
          }
          EOF

      # `bun test integration` is the real-checker suite (compiler *.integration.test.ts).
      # Vite tests stub generate/watch and do not exercise the checker.
      # JSON Schema integration tests do not spawn the checker.
      - name: Integration tests
        id: tests
        run: |
          echo "cell ${{ matrix.id }}: typescript@${{ steps.versions.outputs.typescript }}"
          echo "lib/tsc: ${{ steps.versions.outputs.exe }} (${{ steps.versions.outputs.tsgo }})"
          bun run test:integration

      - name: Record test outcome
        if: always()
        run: |
          {
            echo "### Result (${{ matrix.id }})"
            echo ""
            echo "- outcome: \`${{ steps.tests.outcome }}\`"
            echo "- \`typescript\`: \`${{ steps.versions.outputs.typescript }}\`"
            echo "- lib/tsc: \`${{ steps.versions.outputs.exe }}\` (\`${{ steps.versions.outputs.tsgo }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
