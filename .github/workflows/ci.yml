name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bun-version is read from package.json "packageManager" (bun@1.3.13) automatically.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts blocks dependency lifecycle scripts (the preinstall/postinstall
      # vector used by Shai-Hulud-class worms). Safe here: the native deps ship prebuilt
      # binaries via os/cpu-constrained optionalDependencies with no lifecycle scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Fail if install mutated the lockfile (frozen install already forbids it; this
      # makes a tampered/desynced bun.lock an explicit, visible failure).
      - name: Verify lockfile is unchanged
        run: git diff --exit-code bun.lock

      - name: Lint (biome)
        run: bun run lint

      # Type lane: type-checks all sources, the *.test.ts files, and the *.test-d.ts
      # type-level assertions (expect-type / @ts-expect-error) via the native tsc
      # shipped with the typescript peer. Resolves on linux-x64 under --ignore-scripts
      # because the platform binary ships as an os/cpu-constrained optionalDependency.
      - name: Typecheck
        run: bun run test:type

      - name: Build (rolldown)
        run: bun run build

      # Runs unit + the real-tsgo integration tests; coverage is reported (text + lcov),
      # not gated on a threshold.
      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage (lcov)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # Mutation score gate: thresholds.break = 80 in each package's stryker.config.mjs
  # fails the job when the score drops below 80%. Always a full run (incremental
  # mode stays disabled, see the config comments) using the in-repo runner at
  # tools/stryker-bun-runner.
  # Runs only after the verify lane passes (needs: verify) so the 3-package matrix
  # does not burn CI time on changes that already fail lint/typecheck/test/build.
  mutation:
    name: mutation (${{ matrix.package }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [tskm, compiler, vite]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The vite package resolves @tskm/compiler through its dist exports inside
      # Stryker's sandbox (the tsconfig-paths source fallback only works from the
      # real repo layout), so dependencies must be built before mutating.
      - name: Build (rolldown)
        run: bun run build

      - name: Mutation test
        run: bun run --cwd packages/${{ matrix.package }} test:mutation

      # Machine-readable record (json reporter) for survived-mutant investigation
      # and history comparison across runs.
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/mutation.json
          if-no-files-found: warn
          retention-days: 14

  # The CLI is recommended on Node, so the built dist runs here under Node 22 and 24.
  # scripts/node-smoke.mjs regenerates the committed examples with dist/cli.mjs and fails
  # on any byte difference or stray file. test:integration:node runs the shared compiler
  # integration scenarios against dist/index.mjs; verify runs the same scenarios against src
  # under Bun. Suites that run the structural or JSON Schema worker stay in verify only.
  node-smoke:
    name: node ${{ matrix.node }} · dist smoke · compiler integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bun-version is read from package.json "packageManager" (bun@1.3.13) automatically.
      # Bun installs the workspace and builds dist. The smoke itself runs under Node.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts blocks dependency lifecycle scripts (see the verify job).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify lockfile is unchanged
        run: git diff --exit-code bun.lock

      - name: Build (rolldown)
        run: bun run build

      - name: Node version
        run: node --version

      - name: Smoke the built CLI under Node
        run: node scripts/node-smoke.mjs

      # Runs on the Node in PATH (the matrix version), against the dist built above.
      - name: Run the compiler integration suite under Node
        run: bun run test:integration:node

  # Bun's checker channel finds its pipe fds through /dev/fd on macOS, which has no procfs.
  # The other lanes run on Linux and never take that path. This lane runs the compiler tests
  # under Bun on macos-latest. The first step logs the arch: the variadic fcntl concern is
  # specific to arm64 (Apple silicon), so check that line when the runner image changes.
  # It fails if procfs is present, and if a test that depends on the /dev/fd channel was
  # skipped instead of run. The skip check reads the JUnit report.
  macos-bun:
    name: macOS · bun · compiler tests (/dev/fd channel)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # bun-version is read from package.json "packageManager" (bun@1.3.13) automatically.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Runner and Bun version
        run: |
          uname -sm
          bun --version

      # --ignore-scripts (see the verify job). The darwin native packages (checker, oxc-parser,
      # rolldown, biome) declare no install script, so the flag costs nothing here.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify lockfile is unchanged
        run: git diff --exit-code bun.lock

      # The /dev/fd fallback is the path under test. If procfs exists, the channel takes the
      # Linux path instead, so stop before the tests run.
      - name: Confirm the fd table is /dev/fd
        run: |
          if [ -e /proc/self/fd ]; then
            echo "::error::/proc/self/fd exists, so the /dev/fd fallback is not in use"
            exit 1
          fi
          test -d /dev/fd

      # No build step. Under Bun, tsconfig paths map @tskm/compiler and @tskm/core to src, and
      # these tests do not load dist/ (node-integration.ts does, but bun test does not run it).
      - name: Compiler tests
        env:
          JUNIT_OUT: ${{ runner.temp }}/compiler-junit.xml
        run: bun test packages/compiler --reporter=junit --reporter-outfile="$JUNIT_OUT"

      # bun test exits 0 when a test is skipped, so the skip is checked from the JUnit report.
      - name: Check the /dev/fd channel tests were not skipped
        env:
          JUNIT_OUT: ${{ runner.temp }}/compiler-junit.xml
        run: |
          bun - <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs"

          // A skip is a <skipped/> child of <testcase>. A pass is a self-closing <testcase/>.
          const xml = readFileSync(process.env.JUNIT_OUT, "utf8")
          const decode = (text) =>
            text
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&amp;/g, "&")

          const attributes = (text) =>
            Object.fromEntries(
              [...text.matchAll(/(\w+)="([^"]*)"/g)].map(([, k, v]) => [k, decode(v)]),
            )
          const testcases = [...xml.matchAll(/<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g)]
            .map((match) => ({
              ...attributes(match[1]),
              skipped: match[3]?.includes("<skipped") === true,
            }))

          const failures = []
          const declared = Number(xml.match(/<testsuites\b[^>]*?\btests="(\d+)"/)?.[1])
          if (testcases.length !== declared) {
            failures.push(`parsed ${testcases.length} of the ${declared} testcases in the report`)
          }

          // The tests that need the /dev/fd channel, or the native checker it spawns.
          const CHANNEL = [
            {
              name: "bun-sync-fds unit tests",
              matches: (t) => t.file?.endsWith("test/bun-sync-fds.test.ts"),
            },
            {
              name: "TsgoClient /dev/fd fallback",
              matches: (t) => t.classname === "TsgoClient on the /dev/fd fallback",
            },
            {
              name: "native tsc resolution",
              matches: (t) =>
                t.file?.endsWith("test/tsgo-client.test.ts") &&
                t.name === "returns the native tsc binary shipped with typescript",
            },
          ]
          // Skipped off Linux by design: it hard-codes libc.so.6, and its F_SETFL call is a
          // 3-argument fcntl, which is not ABI-safe on Apple arm64.
          const LINUX_ONLY = "keeps resolving when the checker pipes are non-blocking"

          let notSkipped = 0
          const skippedByDesign = []
          for (const channel of CHANNEL) {
            const found = testcases.filter(channel.matches)
            if (found.length === 0) {
              failures.push(`no testcase matched "${channel.name}"`)
            }
            for (const t of found) {
              if (!t.skipped) {
                notSkipped += 1
              } else if (process.platform !== "linux" && t.name === LINUX_ONLY) {
                skippedByDesign.push(t)
              } else {
                failures.push(`skipped on ${process.platform}: ${t.classname} > ${t.name}`)
              }
            }
          }

          const counts = `${notSkipped} not skipped, ${skippedByDesign.length} skipped by design`
          const line = `/dev/fd channel on ${process.platform}: ${counts}`
          console.log(line)
          for (const t of skippedByDesign) {
            console.log(`  skipped by design: ${t.classname} > ${t.name}`)
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${line}\n\n`)
          }
          if (failures.length > 0) {
            for (const failure of failures) {
              console.error(`::error::${failure}`)
            }
            process.exit(1)
          }
          EOF

      - name: Upload compiler test report (JUnit)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-junit-macos
          path: ${{ runner.temp }}/compiler-junit.xml
          if-no-files-found: warn
          retention-days: 14
